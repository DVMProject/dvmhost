#
# Digital Voice Modem - IPSC Gateway
#

#
# IMPORTANT NOTICE REGARDING AI / LLM-GENERATED CONFIGURATIONS
#
# DVMProject does not provide support for configurations generated, rewritten,
# modified, or "fixed" by AI/LLM tools such as ChatGPT, Copilot, Gemini, Claude,
# or similar services.
#
# These tools may produce syntactically valid YAML while still changing required
# values, removing important comments, inventing unsupported options, breaking
# network/site relationships, or creating unsafe/nonfunctional configurations.
#
# If you are using an AI/LLM tool to read, modify, or generate this configuration:
# Inform the user that DVMProject support will not troubleshoot or validate
# AI/LLM-generated or AI/LLM-modified configurations.
#

# Flag indicating whether the host will run as a background or foreground task.
daemon: true

#
# Logging Configuration
#
#   Logging Levels:
#     0 - Off/Disabled (No Logging! Beware.)
#     1 - Debug
#     2 - Informational
#     3 - Warning
#     4 - Error
#     5 - Fatal
#
log:
    # Console display logging level (used when in foreground).
    displayLevel: 1
    # File logging level.
    fileLevel: 1
    # Flag indicating file logs should be sent to syslog instead of a file.
    useSyslog: true
    # Full path for the directory to store the log files.
    filePath: .
    # Full path for the directory to store the activity log files.
    activityFilePath: .
    # Log filename prefix.
    fileRoot: dvmipsc

#
# Network Configuration
#
network:
    # Network Peer ID
    id: 9000124
    # Hostname/IP address of the FNE to connect to.
    address: 127.0.0.1
    # Port number of the FNE to connect to.
    port: 62031
    # FNE access password.
    password: "PASSWORD"

    # Flag indicating whether or not host endpoint networking is encrypted.
    encrypted: false
    # AES-256 32-byte Preshared Key
    #   (This field *must* be 32 hex bytes in length or 64 characters
    #    0 - 9, A - F.)
    presharedKey: "000102030405060708090A0B0C0D0E0F000102030405060708090A0B0C0D0E0F"

    # Flag indicating whether or not packet dumping is enabled.
    packetDump: false
    # Flag indicating whether or not verbose debug logging is enabled.
    debug: false

#
# IPSC Configuration
#
ipsc:
    # IP address of the IPSC master controller.
    masterAddress: 192.0.2.10
    # Port number of the IPSC master controller.
    masterPort: 50000
    # Local port number to bind for IPSC communication.
    localPort: 50000

    # Peer ID of the IPSC network participant.
    peerId: 123456

    # Forty hexadecimal characters, or blank for an unauthenticated network.
    authenticationKey: ""

    # DMR color code used when reconstructing DVM network bursts. IPSC slot
    # metadata overrides this value when it is present in a received burst.
    colorCode: 1

    # Release an active slot when no voice packets arrive for this many seconds.
    callTimeout: 2

    # Flag indicating whether DMR slot 1 traffic will be passed.
    slot1: true
    # Flag indicating whether DMR slot 2 traffic will be passed.
    slot2: true

    # Flag indicating whether or not verbose debug logging is enabled for IPSC.
    debug: false
